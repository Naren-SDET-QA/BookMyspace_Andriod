# Production Nginx configuration for Flutter Web with SPA routing and AASA support

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Apple App Site Association - enforce application/json MIME type and CORS
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Service Worker - prevent stale caching
    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache immutable static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm|json)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: Route all non-file requests to index.html with HTTP 200
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}
