# Keep scratch/notes folders out of static analysis; they are not shipped code.
analyzer:
  exclude:
    - "Claude outputs/**"
    - build/**
    - lib/**.g.dart
    # The legacy owner demo has no standalone pubspec and is not part of the
    # production Flutter target.
    - example/**
    # Untracked scratch artifacts are kept for reference but are not part of
    # the Flutter package and may intentionally contain incomplete snippets.
    - Claude outputs/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - use_build_context_synchronously
    - use_decorated_box
    - use_super_parameters
