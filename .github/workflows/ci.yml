name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate analyzer baseline
        run: python3 scripts/validate_analyzer_baseline.py

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ci-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate iOS deployment target and plugin requirements
        run: python3 scripts/check_ios_deployment_target.py
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Verify generated iOS deployment target
        run: python3 scripts/check_ios_deployment_target.py --after-build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

  sql-tests:
    name: SQL Migration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable Supabase stack
        run: supabase start
      - name: Verify Supabase system objects
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql \
            -X \
            --set ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            <<'SQL'
          DO $$
          BEGIN
            IF to_regnamespace('auth') IS NULL THEN
              RAISE EXCEPTION 'Supabase auth schema is missing';
            END IF;
            IF to_regclass('auth.users') IS NULL THEN
              RAISE EXCEPTION 'Supabase auth.users is missing';
            END IF;
            IF to_regclass('storage.buckets') IS NULL
               OR to_regclass('storage.objects') IS NULL THEN
              RAISE EXCEPTION 'Supabase Storage objects are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              RAISE EXCEPTION 'Supabase anon role is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              RAISE EXCEPTION 'Supabase authenticated role is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              RAISE EXCEPTION 'Supabase service_role is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'postgis') THEN
              RAISE EXCEPTION 'PostGIS extension is missing';
            END IF;
            IF to_regtype('geography') IS NULL THEN
              RAISE EXCEPTION 'PostGIS geography type is missing';
            END IF;
          END $$;
          SQL
      - name: Apply migrations in dependency order
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
      - name: Run SQL tests
        run: |
          set -euo pipefail
          for test in supabase/tests/*.sql; do
            echo "Running $test..."
            PGPASSWORD=postgres psql \
              -X \
              --set ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -p 54322 \
              -U postgres \
              -d postgres \
              -f "$test"
          done
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
