name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets (redacted)
        id: gitleaks
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            zricethezav/gitleaks:v8.30.1 detect \
            --source=/path \
            --config=/path/gitleaks.toml \
            --redact \
            --report-format=json \
            --report-path=/path/gitleaks.raw.json \
            --exit-code=1 \
            > "${{ github.workspace }}/gitleaks.log" 2>&1
          scan_status=$?

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("gitleaks.raw.json")
          report_path = Path("gitleaks-redacted.json")
          findings = []
          if raw_path.exists():
              raw = json.loads(raw_path.read_text(encoding="utf-8"))
              if isinstance(raw, dict):
                  raw = raw.get("findings", [])
              for finding in raw or []:
                  findings.append(
                      {
                          "rule": finding.get("RuleID"),
                          "file": finding.get("File"),
                          "line": finding.get("StartLine"),
                          "commit": finding.get("Commit"),
                          "fingerprint": finding.get("Fingerprint"),
                      }
                  )
          report_path.write_text(
              json.dumps({"findings": findings}, indent=2) + "\n",
              encoding="utf-8",
          )
          raw_path.unlink(missing_ok=True)
          PY

          rm -f "${{ github.workspace }}/gitleaks.log"
          exit "$scan_status"
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-redacted.json
          if-no-files-found: error
