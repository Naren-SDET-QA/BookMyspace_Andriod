name: bookmyspace
description: "BookMySpace - Premium Coworking, Event & Meeting Space Booking Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.0
  cached_network_image: ^3.3.1
  google_maps_flutter: ^2.7.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  flutter_secure_storage: ^9.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
